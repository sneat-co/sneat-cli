name: Release

# Continuous delivery: every merge to `main` runs the shared strongo/cicd
# release workflow, which bumps the version from conventional commits and
# releases it — all in one run. Pushing an explicit `vX.Y.Z` tag also works
# and releases that exact version (the shared workflow skips the bump on a
# tag ref). A docs/chore-only merge cuts no tag and publishes nothing.
#
# sneat-cli is pre-1.0 (0 releases so far): allow_major_version_bump stays
# false, so a stray `feat!:` is CAPPED to a minor bump instead of jumping to
# v1. Cut v1.0.0 of sneat-co/sneat-cli deliberately by pushing that tag.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# One release at a time; a second push queues instead of racing the first.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build + release (GitHub release, Homebrew cask)
    # Pinned to an immutable tag rather than the floating `v1` of
    # strongo/cicd. This is load-bearing, not cosmetic: `@v1` DEFINES the
    # require_notarized_macos input below but does not (as of this writing)
    # contain the macos_signing_preflight job that input is supposed to gate
    # — on `@v1` the gate silently no-ops, and a stale/revoked Apple
    # credential would ship an unsigned darwin binary via the Homebrew cask
    # with no failure anywhere. v1.14.14 verified (by reading
    # strongo/cicd's release.yml at that tag) to contain the
    # macos_signing_preflight job, gated exactly on this input. Bump this
    # pin deliberately, and re-verify the preflight job is still wired,
    # rather than tracking `@v1`.
    uses: strongo/cicd/.github/workflows/release.yml@v1.14.17
    permissions:
      contents: write
    with:
      go_version: '1.27.0'
      # sneat-cli imports several private sneat-co Go modules (sneat-bots,
      # sneat-core-modules, calendarius/backend, contactus/backend, ...).
      # GoReleaser's `go mod tidy` before-hook needs GOPRIVATE + GH_TOKEN to
      # fetch them — same requirement as .github/workflows/ci.yml, mirrored
      # here so the release build doesn't fail on the first private import.
      GOPRIVATE: github.com/sneat-co
      # Pre-1.0: cap an accidental major (feat!:) to a minor bump. Cut
      # v1.0.0 only by pushing that tag explicitly.
      allow_major_version_bump: false
      # The whole point of this workflow: hard-fail the release if the
      # darwin binaries aren't actually signed with a Developer ID and
      # notarized, instead of silently shipping a Homebrew cask that
      # Gatekeeper blocks for every real user ("Apple could not verify ...
      # is free of malware").
      require_notarized_macos: true
    secrets:
      # Private-module fetch token for GOPRIVATE above (same PAT ci.yml uses
      # as GH_TOKEN).
      GH_TOKEN: ${{ secrets.SNEAT_CI_READWRITE_TOKEN }}
      # Cross-repo PAT for the Homebrew tap (sneat-co/homebrew-tap) — the
      # default GITHUB_TOKEN can't push to a different repo.
      GORELEASER_GITHUB_TOKEN: ${{ secrets.SNEAT_CI_READWRITE_TOKEN }}
      # macOS signing + notarization. These activate the `notarize:` block in
      # .goreleaser.yaml (gated on MACOS_SIGN_P12 being set) and, combined
      # with require_notarized_macos: true above, are enforced from this
      # repo's very first release.
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      NOTARIZE_ISSUER_ID: ${{ secrets.NOTARIZE_ISSUER_ID }}
      NOTARIZE_KEY_ID: ${{ secrets.NOTARIZE_KEY_ID }}
      NOTARIZE_KEY: ${{ secrets.NOTARIZE_KEY }}