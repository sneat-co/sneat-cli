name: Go CI

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+' # Push events to matching v*, i.e. v20.15.10
  pull_request:
    branches:
      - '**'

jobs:

  strongo_workflow:
    # Pinned to an exact tag, not @main and not the moving @v1: unpinned CI
    # silently takes whatever landed upstream, and @v1 lagged 14 patch
    # releases behind while still accepting newer inputs.
    uses: strongo/cicd/.github/workflows/workflow.yml@v1.20.1
    permissions:
      contents: write
    secrets:
      # Org token with read access to private sneat-co repos — required for
      # GOPRIVATE module fetches (same pattern as sneat-go ci.yml).
      GH_TOKEN: ${{ secrets.SNEAT_CI_READWRITE_TOKEN }}
    #      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
    with:
      # Version bump + release happen in release.yml (continuous delivery on
      # push to main). This workflow only builds/lints/tests — disable its
      # bump so it does not create a competing tag.
      #
      # Without this, CI tagged v0.5.1 first; the Release workflow then
      # computed the same proposed version, found it already tagged, and
      # published nothing — a green run with no release.
      disable-version-bumping: true
      GOPRIVATE: github.com/sneat-co
      code_coverage: true

  # Fail fast on go.mod/go.sum drift.
  #
  # This is the signal that would have caught datatug-cli's v0.13.2 before it
  # shipped: two renovate pull requests for the same major bump interleaved and
  # left go.mod requiring a version nothing imported. Build-and-test caught the
  # stale imports only after both had merged; an untidy go.mod is visible on the
  # FIRST of the pair, on its own pull request.
  #
  # `-diff` only reports; it never rewrites go.mod, so unlike a mutating
  # `go mod tidy` it cannot mask the drift it is meant to find. This job belongs
  # to the workflow named by release.yml's `require_workflow_success`, so drift
  # also blocks the release, not just the merge.
  go-mod-tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Must be >= this repo's go.mod `go` directive.
          go-version: '1.27.1'
          cache: true
      # This module tree reaches private repositories, which `go mod tidy`
      # must be able to fetch or it fails resolving them.
      - name: Configure private Go modules
        run: git config --global url."https://x-access-token:${{ secrets.SNEAT_CI_READWRITE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: go mod tidy -diff
        run: go mod tidy -diff
        env:
          GOPRIVATE: github.com/sneat-co
